      key: POST /v1/provisioning/contact-points,
    }
  change the GitHub SSO settings:
    {
      fn: request,
      args: [{ method: PUT, path: /v1/sso-settings/github, body: { settings: { clientId: gh, enabled: true } } }],
      key: 'PUT /v1/sso-settings/{key}',
    }
