# What core's compliance suite needs to certify Grafana against the fake: docs/plugin-authoring.md in core.
fake: test/fake.ts
connection: { baseUrl: '${fake.url}', token: '${fake.token}' }
reads:
  - { fn: request, args: [{ path: /search, query: { query: home, type: dash-db } }], key: GET /search }
  - { fn: request, args: [{ path: /api/dashboards/uid/d-home }], key: 'GET /dashboards/uid/{uid}' }
writes:
  - {
      fn: request,
      args: [{ method: POST, path: /annotations, body: { text: deploy, tags: [ci] } }],
      key: POST /annotations,
    }
  - {
      fn: request,
      args: [{ method: POST, path: /ds/query, body: { queries: [{ refId: A, datasource: { uid: prom }, expr: up }] } }],
      key: POST /ds/query,
    }
rejects:
  - { fn: request, args: [{ path: /datasources/proxy/uid/prom/api/v1/query }] }
  - { fn: request, args: [{ path: /public/dashboards/abc }] }
secrets:
  - { fn: request, args: [{ path: /datasources }], key: GET /datasources, values: ['${fake.dsPassword}'] }
  - {
      fn: request,
      args: [{ path: /datasources/uid/prom }],
      key: 'GET /datasources/uid/{uid}',
      values: ['${fake.dsPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /v1/provisioning/contact-points }],
      key: GET /v1/provisioning/contact-points,
      values: ['${fake.slackUrl}'],
    }
  # The new token and the snapshot delete key come back from lock cases; the sent values are in lock case bodies.
  - {
      fn: request,
      args: [{ path: /org/invites }],
      key: GET /org/invites,
      values:
        [
          '${fake.inviteCode}',
          '${fake.saToken}',
          '${fake.deleteKey}',
          gh-client-secret-777777,
          new-user-password-555555,
          cloud-migration-token-888888,
          new-ds-password-666666,
          license-jwt-999999,
          webhook-password-171717,
          T0KEN-121212,
          T0KEN-181818,
          reset-password-131313,
          old-password-141414,
          new-password-151515,
        ],
    }
connectionTest: { wrong: { token: wrong } }
calls:
  query two data sources:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /ds/query,
            body:
              {
                queries:
                  [
                    { refId: A, datasource: { uid: prom }, expr: up },
                    { refId: B, datasource: { uid: mysql-prod }, rawSql: DELETE FROM users },
                  ],
                from: now-1h,
                to: now,
              },
          },
        ],
      key: POST /ds/query,
    }
  add an annotation:
    {
      fn: request,
      args: [{ method: POST, path: /annotations, body: { text: deploy, tags: [ci] } }],
      key: POST /annotations,
    }
  add a service account token:
    {
      fn: request,
      args: [{ method: POST, path: /serviceaccounts/4/tokens, body: { name: ci } }],
      key: 'POST /serviceaccounts/{serviceAccountId}/tokens',
    }
  take a snapshot:
    { fn: request, args: [{ method: POST, path: /snapshots, body: { dashboard: { title: x } } }], key: POST /snapshots }
  move a data source by id:
    {
      fn: request,
      args:
        [
          {
            method: PUT,
            path: /datasources/5,
            body: { name: Prometheus, type: prometheus, url: 'http://elsewhere.example.net:9090' },
          },
        ],
      key: 'PUT /datasources/{id}',
    }
  move a data source by uid:
    {
      fn: request,
      args:
        [
          {
            method: PUT,
            path: /datasources/uid/prom,
            body: { name: Prometheus, type: prometheus, url: 'http://elsewhere.example.net:9090' },
