      key: 'PUT /datasources/uid/{uid}',
    }
  query with a Datasource key:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /ds/query,
            body: { queries: [{ datasource: { uid: prom }, Datasource: { uid: mysql-prod } }] },
          },
        ],
      key: POST /ds/query,
    }
  add a data source with a URL key:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /datasources,
            body: { name: loki, url: 'http://loki:3100', URL: 'http://evil.example.net' },
