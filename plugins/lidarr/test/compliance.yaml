# What core's compliance suite needs to certify Lidarr against the fake: docs/plugin-authoring.md in core.
fake: test/fake.ts
connection: { baseUrl: '${fake.url}', specBaseUrl: '${fake.specUrl}', apiKey: '${fake.apiKey}' }
reads:
  - {
      fn: request,
      args: [{ path: /api/v1/artist/lookup, query: { term: portishead } }],
      key: GET /api/v1/artist/lookup,
    }
  - { fn: request, args: [{ path: /api/v1/calendar }], key: GET /api/v1/calendar }
writes:
  - { fn: request, args: [{ method: POST, path: /api/v1/tag, body: { label: new } }], key: POST /api/v1/tag }
  - fn: request
    args:
      - method: POST
        path: /api/v1/notification
        body:
          name: Hook
          implementation: Webhook
          fields: [{ name: url, value: 'https://hooks.example.com/t/new-hook-token-121212' }]
    key: POST /api/v1/notification
rejects:
  - { fn: request, args: [{ path: /api/v1/filesystem }] }
secrets:
  - {
      fn: request,
      args: [{ path: /api/v1/config/host }],
      key: GET /api/v1/config/host,
      values: ['${fake.hostApiKey}', '${fake.proxyPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/downloadclient }],
      key: GET /api/v1/downloadclient,
      values: ['${fake.clientPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/indexer }],
      key: GET /api/v1/indexer,
      values: ['${fake.indexerApiKey}', '${fake.trackerPasskey}', '${fake.trackerCookie}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/importlist }],
      key: GET /api/v1/importlist,
      values: ['${fake.listApiKey}', '${fake.spotifyToken}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/notification }],
      key: GET /api/v1/notification,
      values: ['${fake.webhookToken}', '${fake.headerToken}', new-hook-token-121212],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/release, query: { albumId: 16 } }],
      key: GET /api/v1/release,
      values:
        [
          '${fake.releaseApiKey}',
          '${fake.magnetPasskey}',
          '${fake.guidPasskey}',
          '${fake.infoPasskey}',
          '${fake.magnetGuidPasskey}',
        ],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/history }],
      key: GET /api/v1/history,
      values: ['${fake.guidPasskey}', '${fake.infoPasskey}', '${fake.grabPasskey}', '${fake.magnetGuidPasskey}'],
    }
connectionTest: { wrong: { apiKey: wrong } }
