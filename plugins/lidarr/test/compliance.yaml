    {
      fn: request,
      args: [{ method: DELETE, path: /api/v1/artist/1, query: { deleteFiles: true } }],
      key: 'DELETE /api/v1/artist/{id}',
    }
  test the stored download client:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /api/v1/downloadclient/test,
            body:
              {
                id: 6,
