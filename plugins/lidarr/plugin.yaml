# yaml-language-server: $schema=./node_modules/@synoikia/plugin-sdk/plugin-settings.schema.json
# Rules on top of Lidarr's OpenAPI spec for the instance's release (ADR-0002): keys are the spec's own
# paths, `/api/v1` included (`GET /api/v1/artist/{id}`); GET reads, other verbs write, anything unlisted is a write.

defaults:
  # A locked operation without its own literal confirms on its path id, else the instance name.
  confirm: [{ custom: path-id }, instance]
  timeouts: { request: 15000, lookup: 10000 }

instanceName: { op: 'GET /api/v1/system/status', field: instanceName, fallback: Lidarr }

# The web UI and its sign-in, the iCal feed, binary downloads, the multipart backup upload, and host filesystem
# browsing and manual import (the GET lists any directory the Lidarr process can read; the POST re-reads any paths
# the caller names and returns their tags).
exclude:
  - 'GET /'
  - 'GET /{path}'
  - 'GET /content/{path}'
  - '* /login'
  - 'GET /logout'
  - 'GET /ping'
  - 'GET /api'
  - 'GET /feed/*'
  - 'GET /api/v1/log/file*'
  - 'GET /api/v1/mediacover/*'
  - 'GET /api/v1/filesystem*'
  - '* /api/v1/manualimport'
  - 'POST /api/v1/system/backup/restore/upload'

rules:
  # Bulk, instance-wide, sign-in, or runs a program: a human types a confirmation. Single-item writes and deletes
  # are regular writes.
  - match:
      - 'PUT /api/v1/artist/editor'
      - 'DELETE /api/v1/artist/editor'
      - 'PUT /api/v1/config/host/{id}'
      - 'DELETE /api/v1/trackfile/bulk'
      # The metadata server Lidarr trusts, and whether it rewrites the tags inside audio files.
      - 'PUT /api/v1/config/metadataprovider/{id}'
      # `useScriptImport` + `scriptImportPath` run any program on every import; also chmod, chown, recycle bin.
      - 'PUT /api/v1/config/mediamanagement/{id}'
      - 'POST /api/v1/system/shutdown'
      - 'POST /api/v1/system/restart'
      - 'POST /api/v1/system/backup/restore/{id}'
    locked: true
  # Every bulk or editor delete, including one a newer spec adds.
  - match: ['DELETE */bulk', 'DELETE */editor']
    locked: true
  # Resets the UI sign-in; only newer specs have it, so it is a pattern, not a required key.
  - match: 'POST /reset-password*'
    locked: true

  # Locked twins picked per call (src/catalog.ts): deleting files in bulk, moving files on disk, a command not in
  # `plugin.quickCommands`, a notification that runs a program, a download client that writes to a host folder,
  # and a provider save, test or action that sends the stored credentials to a destination other than the stored one.
  - match: 'DELETE /api/v1/artist/editor'
    split: delete-files
  - match: 'PUT /api/v1/artist/{id}'
    split: move-files
  - match: 'POST /api/v1/command'
    split: heavy
  - match:
      - 'POST /api/v1/notification'
      - 'PUT /api/v1/notification/{id}'
      - 'POST /api/v1/notification/test'
      - 'POST /api/v1/notification/testall'
      - 'POST /api/v1/notification/action/{name}'
    split: script
  - match:
      - 'POST /api/v1/downloadclient'
      - 'PUT /api/v1/downloadclient/{id}'
      - 'POST /api/v1/downloadclient/test'
      - 'POST /api/v1/downloadclient/action/{name}'
    split: folder
  - match:
      - 'POST /api/v1/downloadclient/test'
      - 'POST /api/v1/downloadclient/action/{name}'
      - 'POST /api/v1/indexer/test'
      - 'POST /api/v1/indexer/action/{name}'
      - 'POST /api/v1/importlist/test'
      - 'POST /api/v1/importlist/action/{name}'
      - 'POST /api/v1/notification/test'
      - 'POST /api/v1/notification/action/{name}'
      - 'PUT /api/v1/downloadclient/{id}'
      - 'PUT /api/v1/indexer/{id}'
      - 'PUT /api/v1/importlist/{id}'
      - 'PUT /api/v1/notification/{id}'
    split: stored

  # What each locked, split or twin operation does, and why it matters.
  - match: '*#delete-files'
    description: '{base} with deleteFiles: also deletes the files of every listed artist from disk. Locked.'
    summaryNote: '(also deletes the files from disk)'
  - match: '*#move-files'
    description: '{base} with moveFiles: moves the artist folder on disk. Locked.'
    summaryNote: '(moves the files on disk)'
  - match: '*#heavy'
    description: >-
      Starting a command that renames, retags, moves or deletes files, imports from a folder, clears data, updates,
      restarts or reconfigures Lidarr, or one not reviewed: locked.
    summaryNote: '(renames, retags, moves or deletes files, clears data, or changes the application)'
  - match: '*#script'
    description: >-
      {base} for a notification that runs a program (Custom Script, or a path or script field), or a test of every
      notification while one does: Lidarr runs the program on its host. Locked.
    summaryNote: '(runs a program on the Lidarr host)'
  - match: '*#folder'
    description: >-
      {base} for a download client that writes files to a host folder (Torrent or Usenet Blackhole, Pneumatic, or a
      folder or path field): Lidarr reads and writes that folder. Locked.
    summaryNote: '(writes files to a folder on the Lidarr host)'
  - match: '*#stored'
    description: >-
      {base} for a stored connection whose host, port, URL, SSL or type changes (a save tests it too): Lidarr fills in the saved password
      or API key and sends it to the new destination. Locked.
    summaryNote: '(sends the stored credentials to a destination other than the stored one)'
  - match: 'PUT /api/v1/artist/editor'
    description: >-
      Changes many artists at once: monitoring, quality profile, tags, root folder (moveFiles moves their folders).
      Locked as a bulk edit.
  - match: 'DELETE /api/v1/artist/editor'
    description: 'Deletes many artists at once; with deleteFiles it takes the #delete-files twin. Locked as a bulk delete.'
  - match: ['DELETE */bulk', 'DELETE */editor']
    description: '{base}: deletes every item the body lists in one call. Locked as a bulk delete.'
  - match: 'DELETE /api/v1/trackfile/bulk'
    description: 'Deletes many track files from disk at once. Locked as a bulk delete.'
    summaryNote: '(deletes the files from disk)'
  - match: 'PUT /api/v1/config/metadataprovider/{id}'
    description: >-
      Changes the metadata server Lidarr trusts and whether it rewrites the tags inside audio files. Locked as
      instance configuration.
    summaryNote: '(metadata server, and whether Lidarr rewrites the tags in audio files)'
  - match: 'PUT /api/v1/config/host/{id}'
    description: >-
      Changes the host settings: sign-in, API key, bind address, port, URL base, SSL, proxy and update script.
      Locked: it can lock users out or expose Lidarr.
    summaryNote: '(sign-in, bind address, port, URL base, proxy and update script)'
  - match: 'PUT /api/v1/config/mediamanagement/{id}'
    description: >-
      Changes media management: the import script, file permissions and owner, and the recycle bin. Locked: the
      import script runs any program on every import.
    summaryNote: '(import script, file permissions and owner, recycle bin)'
  - match: 'POST /api/v1/system/shutdown'
    description: 'Shuts Lidarr down until someone starts it again. Locked.'
  - match: 'POST /api/v1/system/restart'
    description: 'Restarts Lidarr, stopping running commands and imports. Locked.'
  - match: 'POST /api/v1/system/backup/restore/{id}'
    description: 'Restores a stored backup over the database and settings, then restarts. Locked.'
    summaryNote: '(replaces the database and settings, then restarts)'
  - match: 'POST /reset-password*'
    description: 'Resets the web UI sign-in password, or asks for a reset. Locked: it changes who can sign in.'
    summaryNote: '(resets the UI login)'
    sensitiveParams: [/body/password, /body/passwordConfirmation, /body/token]
  - match: 'PUT /api/v1/artist/{id}'
    description: 'Changes an artist: monitoring, quality profile, tags, path. With moveFiles it takes the #move-files twin.'
  - match: 'POST /api/v1/command'
    description: 'Runs a command (search, refresh, rescan, backup). One not in the quick list takes the #heavy twin.'
  - match:
      - 'POST /api/v1/downloadclient'
      - 'PUT /api/v1/downloadclient/{id}'
      - 'POST /api/v1/downloadclient/test'
      - 'POST /api/v1/downloadclient/action/{name}'
    description: >-
      {base}: a client that writes files to a host folder takes the #folder twin, and a stored one sent to a new
      destination the #stored twin.
  - match: ['POST /api/v1/notification', 'POST /api/v1/notification/testall']
    description: '{base}: a notification that runs a program takes the #script twin.'
  - match:
      ['PUT /api/v1/notification/{id}', 'POST /api/v1/notification/test', 'POST /api/v1/notification/action/{name}']
    description: >-
      {base}: a notification that runs a program takes the #script twin, and a stored one sent to a new destination
      the #stored twin.
  - match:
      - 'POST /api/v1/indexer/test'
      - 'POST /api/v1/indexer/action/{name}'
      - 'PUT /api/v1/indexer/{id}'
      - 'POST /api/v1/importlist/test'
      - 'POST /api/v1/importlist/action/{name}'
      - 'PUT /api/v1/importlist/{id}'
    description: '{base}: a stored connection sent to a new destination (path or body `id`) takes the #stored twin.'

  # The literal an approver types: the stored item's name, never a body field the model writes except on create.
  - match: '* /api/v1/artist/{id}*'
    confirm:
      lookup: { op: 'GET /api/v1/artist/{id}', args: [{ id: { $param: /path/id } }], field: artistName }
  - match: ['* /api/v1/artist/editor*', 'DELETE */bulk']
    confirm: [{ custom: count }, instance]
  - match: '* /api/v1/system/backup/*'
    confirm:
      lookup: { op: 'GET /api/v1/system/backup', find: { field: id, equals: { $param: /path/id } }, field: name }
  - match:
      - 'PUT /api/v1/config/host/{id}'
      - 'PUT /api/v1/config/metadataprovider/{id}'
      - 'PUT /api/v1/config/mediamanagement/{id}'
      - 'POST /api/v1/system/shutdown'
      - 'POST /api/v1/system/restart'
      - 'POST /reset-password*'
      - 'POST /api/v1/notification/testall#script'
    confirm: instance
  - match: '*#heavy'
    confirm: [{ custom: command }, instance]
  - match: 'POST /api/v1/downloadclient/*#stored'
    confirm:
      lookup: { op: 'GET /api/v1/downloadclient/{id}', args: [{ id: { $param: /body/id } }], field: name }
  - match: 'POST /api/v1/indexer/*#stored'
    confirm:
      lookup: { op: 'GET /api/v1/indexer/{id}', args: [{ id: { $param: /body/id } }], field: name }
  - match: 'POST /api/v1/importlist/*#stored'
    confirm:
      lookup: { op: 'GET /api/v1/importlist/{id}', args: [{ id: { $param: /body/id } }], field: name }
  - match: 'PUT /api/v1/downloadclient/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v1/downloadclient/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: 'PUT /api/v1/indexer/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v1/indexer/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: 'PUT /api/v1/importlist/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v1/importlist/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: 'PUT /api/v1/notification/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v1/notification/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: ['POST /api/v1/downloadclient#folder', 'POST /api/v1/downloadclient/*#folder']
    confirm:
      - lookup: { op: 'GET /api/v1/downloadclient/{id}', args: [{ id: { $param: /body/id } }], field: name }
      - param: /body/name
      - instance
  - match:
      ['POST /api/v1/notification#script', 'POST /api/v1/notification/*#script', 'POST /api/v1/notification/*#stored']
    confirm:
      - lookup: { op: 'GET /api/v1/notification/{id}', args: [{ id: { $param: /body/id } }], field: name }
      - param: /body/name
      - instance

  # Provider settings carry passwords, API keys and webhook URLs with tokens in `fields[].value`; the approver
  # sees the destination host as a target instead (src/targets.ts).
  - match:
      - '* /api/v1/downloadclient*'
      - '* /api/v1/indexer*'
      - '* /api/v1/importlist*'
      - '* /api/v1/notification*'
      - '* /api/v1/metadata*'
    sensitiveParams: [/body/fields]
  - match: 'PUT /api/v1/config/host/{id}'
    sensitiveParams:
      [/body/apiKey, /body/password, /body/passwordConfirmation, /body/proxyPassword, /body/sslCertPassword]
  # A pushed release's links and guid can carry the indexer's API key or the tracker passkey.
  - match: 'POST /api/v1/release/push'
    sensitiveParams: [/body/downloadUrl, /body/magnetUrl, /body/guid, /body/infoUrl, /body/commentUrl]
  - match: '* /api/v1/config/host*'
    sensitiveResult: { keys: [apiKey, password, passwordConfirmation, proxyPassword, sslCertPassword] }
  # Release and history links carry the indexer's API key or the tracker passkey. src/plugin.ts also hides them in
  # any case and cuts link-shaped guids, info and comment links to their origin.
  - match: ['* /api/v1/release*', '* /api/v1/history*']
    sensitiveResult: { keys: [downloadUrl, magnetUrl, url], deep: true }

plugin:
  # The spec for the instance's release tag (v<4-part version>), else the fallback branch; the base URL is a
  # connection field (`specBaseUrl`), so a mirror with the layout <url>/<ref>/<file> works offline.
  spec:
    baseUrl: https://raw.githubusercontent.com/Lidarr/Lidarr
    file: src/Lidarr.Api.V1/openapi.json
    fallbackRef: develop
    maxBytes: 5242880
    timeoutMs: 20000
  # Endpoint and field that report the version (it needs the API key, so it also proves it).
  versionPath: /api/v1/system/status
  versionField: version
  # Refuse a spec with fewer operations: a truncated one must not replace the catalog.
  minOperations: 150
  # Commands that only search or check take the ordinary `POST /api/v1/command`. Any other name, a future one
  # included, takes the locked `#heavy` twin: `RefreshArtist`, `RefreshAlbum`, `BulkRefreshArtist` (a refresh
  # rescans and, with `writeAudioTags: sync`, rewrites tags), `RescanFolders` (any folder, adds artists),
  # `RetagFiles`, `RenameFiles`, `ApplicationUpdateCheck` (installs an update when started by hand). Lidarr matches
  # names case-insensitively.
  quickCommands:
    - AlbumSearch
    - ArtistSearch
    - Backup
    - CheckHealth
    - CutoffUnmetAlbumSearch
    - Housekeeping
    - ImportListSync
    - MissingAlbumSearch
    - RefreshMonitoredDownloads
    - RssSync
  # Request keys the rules, targets and pointers read, in Lidarr's spelling. Lidarr binds query and body keys
  # case-insensitively, so `MoveFiles` or `Id` is renamed to this spelling, and two keys that differ only in case
  # are refused (src/request.ts).
  # Top-level body keys that also decide where a provider connects, for the #stored check (src/stored.ts).
  destinationKeys: []
  canonicalKeys:
    - id
    - name
    - fields
    - implementation
    - title
    - path
    - rootFolderPath
    - artistIds
    - ids
    - trackFileIds
    - deleteFiles
    - moveFiles
    - addImportListExclusion
    - downloadUrl
    - magnetUrl
    - guid
    - infoUrl
    - commentUrl
    - apiKey
    - password
    - passwordConfirmation
    - proxyPassword
    - sslCertPassword
    - useScriptImport
    - scriptImportPath
    - token
