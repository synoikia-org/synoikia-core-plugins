calls:
  find pasta recipes:
    { fn: request, args: [{ path: /api/recipes, query: { search: pasta, perPage: 10 } }], key: GET /api/recipes }
  read the pasta recipe: { fn: request, args: [{ path: /api/recipes/pasta }], key: 'GET /api/recipes/{slug}' }
  import the ramen recipe:
    {
      fn: request,
      args: [{ method: POST, path: /api/recipes/create/url, body: { url: https://x.example/ramen } }],
      key: POST /api/recipes/create/url,
    }
  delete the comment c-1:
    { fn: request, args: [{ method: DELETE, path: /api/comments/c-1 }], key: 'DELETE /api/comments/{item_id}' }
  delete the food f-1:
    { fn: request, args: [{ method: DELETE, path: /api/foods/f-1 }], key: 'DELETE /api/foods/{item_id}' }
  create an API token:
    {
      fn: request,
      args: [{ method: POST, path: /api/users/api-tokens, body: { name: scripts } }],
      key: POST /api/users/api-tokens,
    }
  create a password reset token for alex:
    {
      fn: request,
      args: [{ method: POST, path: /api/admin/users/password-reset-token, body: { email: alex@example.com } }],
      key: POST /api/admin/users/password-reset-token,
    }
