# What core's compliance suite needs to certify Mealie against the fake: docs/plugin-authoring.md in core.
fake: test/fake.ts
connection: { baseUrl: '${fake.url}', token: '${fake.token}' }
reads:
  - { fn: request, args: [{ path: /api/recipes, query: { search: pasta, perPage: 10 } }], key: GET /api/recipes }
  - { fn: request, args: [{ path: /api/recipes/pasta }], key: 'GET /api/recipes/{slug}' }
writes:
  - {
      fn: request,
      args: [{ method: POST, path: /api/households/shopping/items, body: { shoppingListId: l-1, note: milk } }],
      key: POST /api/households/shopping/items,
    }
  - {
      fn: request,
      args: [{ method: POST, path: /api/recipes/create/url, body: { url: https://x.example/ramen } }],
      key: POST /api/recipes/create/url,
    }
rejects:
  - { fn: request, args: [{ path: /recipes }] }
secrets:
  - { fn: request, args: [{ path: /api/admin/about }], key: GET /api/admin/about, values: ['${fake.dbUrl}'] }
  - {
      fn: request,
      args: [{ path: /api/households/webhooks }],
      key: GET /api/households/webhooks,
      values: ['${fake.hookSecret}'],
    }
  - {
      fn: request,
      args: [{ path: /api/households/invitations }],
      key: GET /api/households/invitations,
      values:
        [
          '${fake.inviteToken}',
          '${fake.apiToken}',
          '${fake.resetToken}',
          '${fake.newUserPassword}',
          '${fake.aiKey}',
          '${fake.oldPassword}',
          '${fake.newPassword}',
          '${fake.resetCode}',
          '${fake.resetPassword}',
        ],
    }
connectionTest: { wrong: { token: wrong } }
locks:
  POST /api/admin/users:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /api/admin/users,
            body: { username: sam, email: sam@example.com, password: '${fake.newUserPassword}' },
          },
        ],
      confirm: sam,
      target: /api/admin/users,
    }
  PUT /api/admin/users/{item_id}:
    {
      fn: request,
      args: [{ method: PUT, path: /api/admin/users/u-2, body: { admin: true } }],
      confirm: alex,
      target: /api/admin/users/u-2,
    }
  DELETE /api/admin/users/{item_id}:
    { fn: request, args: [{ method: DELETE, path: /api/admin/users/u-2 }], confirm: alex, target: /api/admin/users/u-2 }
  POST /api/admin/users/unlock:
    {
      fn: request,
      args: [{ method: POST, path: /api/admin/users/unlock }],
      confirm: Home,
      target: /api/admin/users/unlock,
    }
  POST /api/admin/users/password-reset-token:
    {
      fn: request,
      args: [{ method: POST, path: /api/admin/users/password-reset-token, body: { email: alex@example.com } }],
      confirm: alex@example.com,
      target: /api/admin/users/password-reset-token,
    }
  POST /api/admin/groups:
    {
      fn: request,
      args: [{ method: POST, path: /api/admin/groups, body: { name: Cabin } }],
      confirm: Cabin,
      target: /api/admin/groups,
