calls:
  search for dune:
    { fn: request, args: [{ path: /api/v1/search, query: { query: dune, type: search } }], key: GET /api/v1/search }
  check the health:
    {
      fn: request,
      args: [{ method: POST, path: /api/v1/command, body: { name: CheckHealth } }],
      key: POST /api/v1/command,
    }
  delete the first indexer:
    { fn: request, args: [{ method: DELETE, path: /api/v1/indexer/1 }], key: 'DELETE /api/v1/indexer/{id}' }
  add a vpn proxy:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /api/v1/indexerproxy,
            body: { name: VPN, implementation: Socks5, tags: [16], fields: [{ name: host, value: vpn.lan }] },
          },
        ],
      key: POST /api/v1/indexerproxy,
    }
  add a radarr application:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /api/v1/applications,
            body:
              {
                name: Radarr,
                implementation: Radarr,
                fields:
                  [
                    { name: prowlarrUrl, value: 'http://prowlarr.lan:9696' },
                    { name: baseUrl, value: 'http://radarr.lan:7878' },
                    { name: apiKey, value: new-app-key-141414, privacy: apiKey },
                  ],
              },
          },
        ],
      key: POST /api/v1/applications,
    }
  test the stored download client:
    {
      fn: request,
      args:
        [
          {
            method: POST,
            path: /api/v1/downloadclient/test,
            body:
              {
                id: 6,
                name: qBit,
                implementation: QBittorrent,
                enable: true,
                fields:
                  [
                    { name: host, value: qbittorrent.lan, privacy: normal },
                    { name: port, value: 8080, privacy: normal },
                    { name: useSsl, value: false, privacy: normal },
                    { name: password, value: '********', privacy: password },
                  ],
              },
          },
        ],
      key: POST /api/v1/downloadclient/test,
    }
