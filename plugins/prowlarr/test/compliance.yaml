# What core's compliance suite needs to certify Prowlarr against the fake: docs/plugin-authoring.md in core.
fake: test/fake.ts
connection: { baseUrl: '${fake.url}', specBaseUrl: '${fake.specUrl}', apiKey: '${fake.apiKey}' }
reads:
  - { fn: request, args: [{ path: /api/v1/search, query: { query: dune, type: search } }], key: GET /api/v1/search }
  - { fn: request, args: [{ path: /api/v1/indexerstats }], key: GET /api/v1/indexerstats }
writes:
  - { fn: request, args: [{ method: POST, path: /api/v1/tag, body: { label: new } }], key: POST /api/v1/tag }
  - fn: request
    args:
      - method: POST
        path: /api/v1/applications
        body:
          name: Radarr
          implementation: Radarr
          fields:
            - { name: prowlarrUrl, value: 'http://prowlarr.lan:9696' }
            - { name: baseUrl, value: 'http://radarr.lan:7878' }
            - { name: apiKey, value: new-app-key-141414, privacy: apiKey }
    key: POST /api/v1/applications
rejects:
  - { fn: request, args: [{ path: /api/v1/filesystem }] }
secrets:
  - {
      fn: request,
      args: [{ path: /api/v1/search, query: { query: dune, type: search } }],
      key: GET /api/v1/search,
      values: ['${fake.hostApiKey}', '${fake.trackerPasskey}', '${fake.magnetGuidPasskey}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/config/host }],
      key: GET /api/v1/config/host,
      values: ['${fake.hostApiKey}', '${fake.proxyPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/downloadclient }],
      key: GET /api/v1/downloadclient,
      values: ['${fake.clientPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/indexer }],
      key: GET /api/v1/indexer,
      values:
        [
          '${fake.indexerApiKey}',
          '${fake.trackerPasskey}',
          '${fake.trackerCookie}',
          '${fake.cardigannPassword}',
          '${fake.twoFactor}',
          '${fake.trackerPid}',
        ],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/applications }],
      key: GET /api/v1/applications,
      values: ['${fake.appApiKey}', new-app-key-141414],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/indexerproxy }],
      key: GET /api/v1/indexerproxy,
      values: ['${fake.socksPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/notification }],
      key: GET /api/v1/notification,
      values: ['${fake.webhookToken}', '${fake.headerToken}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v1/history }],
      key: GET /api/v1/history,
      values: ['${fake.indexerApiKey}', '${fake.trackerPasskey}', '${fake.grabPasskey}', '${fake.infoPasskey}'],
    }
connectionTest: { wrong: { apiKey: wrong } }
