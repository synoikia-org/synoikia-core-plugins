# What core's compliance suite needs to certify Plex against the fake: docs/plugin-authoring.md in core.
fake: test/fake.ts
connection: { baseUrl: '${fake.url}', specBaseUrl: '${fake.specUrl}', token: '${fake.token}' }
reads:
  - { fn: request, args: [{ path: /library/sections/all }], key: GET /library/sections/all }
  - {
      fn: request,
      args: [{ path: /library/sections/1/recentlyAdded, query: { X-Plex-Container-Size: 5 } }],
      key: 'GET /library/sections/{sectionId}/recentlyAdded',
    }
  - { fn: request, args: [{ path: /hubs/search, query: { query: incep } }], key: GET /hubs/search }
  - { fn: request, args: [{ path: /playQueues/55 }], key: 'GET /playQueues/{playQueueId}' }
  - { fn: request, args: [{ path: /playlists }], key: GET /playlists }
writes:
  - {
      fn: request,
      args: [{ method: PUT, path: '/:/scrobble', query: { key: 101, identifier: com.plexapp.plugins.library } }],
      key: 'PUT /:/scrobble',
    }
  - {
      fn: request,
      args: [{ method: PUT, path: '/:/unscrobble', query: { key: 101, identifier: com.plexapp.plugins.library } }],
      key: 'PUT /:/unscrobble',
    }
rejects:
  - { fn: request, args: [{ path: /users/account.json }] }
  - { fn: request, args: [{ path: /services/browse }] }
  - { fn: request, args: [{ path: /diagnostics/logs }] }
secrets:
  - {
      fn: request,
      args: [{ path: '/:/prefs' }],
      key: 'GET /:/prefs',
      values: ['${fake.onlineToken}', '${fake.certKey}'],
    }
  - { fn: request, args: [{ path: /status/sessions }], key: GET /status/sessions, values: ['${fake.thumbToken}'] }
  - { fn: request, args: [{ path: /media/providers }], key: GET /media/providers, values: ['${fake.providerUrlToken}'] }
  - { fn: request, args: [{ path: /myplex/account }], key: GET /myplex/account, values: ['${fake.accountToken}'] }
  - { fn: request, args: [{ path: /servers }], key: GET /servers, values: ['${fake.serverToken}'] }
  # The URL keys that lock cases send: none may reach an approval or the audit log.
  - {
      fn: request,
      args: [{ path: /devices }],
      key: GET /devices,
      values:
        ['${fake.deviceToken}', trailer-signature-888888, provider-key-999999, subtitle-key-131313, tuner-key-141414],
    }
connectionTest: { wrong: { token: wrong } }
calls:
  mark Inception watched:
    {
      fn: request,
      args: [{ method: PUT, path: '/:/scrobble', query: { key: 101, identifier: com.plexapp.plugins.library } }],
      key: 'PUT /:/scrobble',
    }
  delete Inception:
    { fn: request, args: [{ method: DELETE, path: /library/metadata/101 }], key: 'DELETE /library/metadata/{ids}' }
  delete the Road Trip playlist:
    { fn: request, args: [{ method: DELETE, path: /playlists/401 }], key: 'DELETE /playlists/{playlistId}' }
  clear the library caches:
    { fn: request, args: [{ method: DELETE, path: /library/caches }], key: DELETE /library/caches }
  stop a session:
    {
      fn: request,
      args: [{ method: POST, path: /status/sessions/terminate, query: { sessionId: sess-1 } }],
      key: POST /status/sessions/terminate,
    }
  analyze Inception again:
    {
      fn: request,
      args: [{ method: GET, path: /library/metadata/101, query: { asyncRefreshAnalysis: 1 } }],
      key: 'GET /library/metadata/{ids}#refresh',
    }
  refresh the metadata of the Movies library:
    {
      fn: request,
      args: [{ method: GET, path: /library/sections/1/all, query: { asyncAugmentMetadata: true } }],
      key: 'GET /library/sections/{sectionId}/all#refresh',
    }
  write back a masked token:
    {
      fn: request,
      args: [{ method: PUT, path: '/:/prefs', query: { PlexOnlineToken: '[REDACTED]' } }],
      key: 'PUT /:/prefs',
    }
locks:
  DELETE /library/sections/{sectionId}:
    { fn: request, args: [{ method: DELETE, path: /library/sections/1 }], confirm: Movies, target: library Movies }
  GET /library/sections/{sectionId}/emptyTrash:
    {
      fn: request,
      args: [{ method: GET, path: /library/sections/1/emptyTrash }],
      confirm: Movies,
      target: library Movies,
    }
  POST /library/sections/{sectionId}/emptyTrash:
    {
      fn: request,
      args: [{ method: POST, path: /library/sections/1/emptyTrash }],
      confirm: Movies,
      target: library Movies,
    }
  PUT /library/sections/{sectionId}/emptyTrash:
    {
      fn: request,
      args: [{ method: PUT, path: /library/sections/1/emptyTrash }],
      confirm: Movies,
      target: library Movies,
    }
  GET /library/sections/{sectionId}/optimize:
    {
      fn: request,
      args: [{ method: GET, path: /library/sections/1/optimize }],
      confirm: Movies,
      target: library Movies,
    }
  POST /library/sections/{sectionId}/optimize:
