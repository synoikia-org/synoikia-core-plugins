# What core's compliance suite needs to certify Radarr against the fake: docs/plugin-authoring.md in core.
fake: test/fake.ts
connection: { baseUrl: '${fake.url}', specBaseUrl: '${fake.specUrl}', apiKey: '${fake.apiKey}' }
reads:
  - { fn: request, args: [{ path: /api/v3/movie/lookup, query: { term: dune } }], key: GET /api/v3/movie/lookup }
  - { fn: request, args: [{ path: /api/v3/calendar }], key: GET /api/v3/calendar }
writes:
  - { fn: request, args: [{ method: POST, path: /api/v3/tag, body: { label: new } }], key: POST /api/v3/tag }
  - fn: request
    args:
      - method: POST
        path: /api/v3/notification
        body:
          name: Hook
          implementation: Webhook
          fields: [{ name: url, value: 'https://hooks.example.com/t/new-hook-token-121212' }]
    key: POST /api/v3/notification
rejects:
  - { fn: request, args: [{ path: /api/v3/filesystem }] }
secrets:
  - {
      fn: request,
      args: [{ path: /api/v3/config/host }],
      key: GET /api/v3/config/host,
      values: ['${fake.hostApiKey}', '${fake.proxyPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v3/downloadclient }],
      key: GET /api/v3/downloadclient,
      values: ['${fake.clientPassword}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v3/indexer }],
      key: GET /api/v3/indexer,
      values: ['${fake.indexerApiKey}', '${fake.trackerPasskey}', '${fake.trackerCookie}'],
    }
  - {
      fn: request,
      args: [{ path: /api/v3/notification }],
      key: GET /api/v3/notification,
      values: ['${fake.webhookToken}', '${fake.headerToken}', new-hook-token-121212],
    }
  - {
      fn: request,
      args: [{ path: /api/v3/release, query: { movieId: 1 } }],
      key: GET /api/v3/release,
      values:
        [
          '${fake.releaseApiKey}',
          '${fake.magnetPasskey}',
          '${fake.guidPasskey}',
          '${fake.infoPasskey}',
          '${fake.magnetGuidPasskey}',
        ],
    }
  - {
      fn: request,
      args: [{ path: /api/v3/history }],
      key: GET /api/v3/history,
      values: ['${fake.guidPasskey}', '${fake.infoPasskey}', '${fake.grabPasskey}', '${fake.magnetGuidPasskey}'],
    }
connectionTest: { wrong: { apiKey: wrong } }
