# yaml-language-server: $schema=./node_modules/@synoikia/plugin-sdk/plugin-settings.schema.json
# Rules on top of Radarr's OpenAPI spec for the instance's release (ADR-0002): keys are the spec's own
# paths, `/api/v3` included (`GET /api/v3/movie/{id}`); GET reads, other verbs write, anything unlisted is a write.

defaults:
  # A locked operation without its own literal confirms on its path id, else the instance name.
  confirm: [{ custom: path-id }, instance]
  timeouts: { request: 15000, lookup: 10000 }

instanceName: { op: 'GET /api/v3/system/status', field: instanceName, fallback: Radarr }

# The web UI and its sign-in, the iCal feed, binary downloads, the multipart backup upload, and host filesystem
# browsing and the manual-import scan and reprocess (they list or read any path the Radarr process can read).
exclude:
  - 'GET /'
  - 'GET /{path}'
  - 'GET /content/{path}'
  - '* /login'
  - 'GET /logout'
  - 'GET /ping'
  - 'GET /api'
  - 'GET /feed/*'
  - 'GET /api/v3/log/file*'
  - 'GET /api/v3/mediacover/*'
  - 'GET /api/v3/filesystem*'
  - '* /api/v3/manualimport'
  - 'POST /api/v3/system/backup/restore/upload'

rules:
  # Bulk, instance-wide, sign-in, or runs a program: a human types a confirmation. Single-item writes and deletes
  # are regular writes.
  - match:
      - 'PUT /api/v3/movie/editor'
      - 'DELETE /api/v3/movie/editor'
      - 'PUT /api/v3/config/host/{id}'
      # `useScriptImport` + `scriptImportPath` run any program on every import; also chmod, chown, recycle bin.
      - 'PUT /api/v3/config/mediamanagement/{id}'
      - 'POST /api/v3/system/shutdown'
      - 'POST /api/v3/system/restart'
      - 'POST /api/v3/system/backup/restore/{id}'
    locked: true
  # Every bulk or editor delete, including one a newer spec adds.
  - match: ['DELETE */bulk', 'DELETE */editor']
    locked: true
  # Resets the UI sign-in; only newer specs have it, so it is a pattern, not a required key.
  - match: 'POST /reset-password*'
    locked: true

  # Locked twins picked per call (src/catalog.ts): deleting files in bulk, moving files on disk, a command not in
  # `plugin.quickCommands`, a notification that runs a program, a download client that writes to a host folder,
  # and a provider save, test or action that sends the stored credentials to a destination other than the stored one.
  - match: 'DELETE /api/v3/movie/editor'
    split: delete-files
  - match: 'PUT /api/v3/movie/{id}'
    split: move-files
  - match: 'POST /api/v3/command'
    split: heavy
  - match:
      - 'POST /api/v3/notification'
      - 'PUT /api/v3/notification/{id}'
      - 'POST /api/v3/notification/test'
      - 'POST /api/v3/notification/testall'
      - 'POST /api/v3/notification/action/{name}'
    split: script
  - match:
      - 'POST /api/v3/downloadclient'
      - 'PUT /api/v3/downloadclient/{id}'
      - 'POST /api/v3/downloadclient/test'
      - 'POST /api/v3/downloadclient/action/{name}'
    split: folder
  - match:
      - 'POST /api/v3/downloadclient/test'
      - 'POST /api/v3/downloadclient/action/{name}'
      - 'POST /api/v3/indexer/test'
      - 'POST /api/v3/indexer/action/{name}'
      - 'POST /api/v3/importlist/test'
      - 'POST /api/v3/importlist/action/{name}'
      - 'POST /api/v3/notification/test'
      - 'POST /api/v3/notification/action/{name}'
      - 'PUT /api/v3/downloadclient/{id}'
      - 'PUT /api/v3/indexer/{id}'
      - 'PUT /api/v3/importlist/{id}'
      - 'PUT /api/v3/notification/{id}'
    split: stored

  # What each locked, split or twin operation does, and why it matters.
  - match: '*#delete-files'
    description: '{base} with deleteFiles: also deletes the files of every listed movie from disk. Locked.'
    summaryNote: '(also deletes the files from disk)'
  - match: '*#move-files'
    description: '{base} with moveFiles: moves the movie folder on disk. Locked.'
    summaryNote: '(moves the files on disk)'
  - match: '*#heavy'
    description: >-
      Starting a command that renames, moves or deletes files, clears data, updates, restarts or reconfigures
      Radarr, or one not reviewed: locked.
    summaryNote: '(renames, moves or deletes files, clears data, or changes the application)'
  - match: '*#script'
    description: >-
      {base} for a notification that runs a program (Custom Script, or a path or script field), or a test of every
      notification while one does: Radarr runs the program on its host. Locked.
    summaryNote: '(runs a program on the Radarr host)'
  - match: '*#folder'
    description: >-
      {base} for a download client that writes files to a host folder (Torrent or Usenet Blackhole, Pneumatic, or a
      folder or path field): Radarr reads and writes that folder. Locked.
    summaryNote: '(writes files to a folder on the Radarr host)'
  - match: '*#stored'
    description: >-
      {base} for a stored connection whose host, port, URL, SSL or type changes (a save tests it too): Radarr fills in the saved password
      or API key and sends it to the new destination. Locked.
    summaryNote: '(sends the stored credentials to a destination other than the stored one)'
  - match: 'PUT /api/v3/movie/editor'
    description: >-
      Changes many movies at once: monitoring, quality profile, tags, root folder (moveFiles moves their folders).
      Locked as a bulk edit.
  - match: 'DELETE /api/v3/movie/editor'
    description: 'Deletes many movies at once; with deleteFiles it takes the #delete-files twin. Locked as a bulk delete.'
  - match: ['DELETE */bulk', 'DELETE */editor']
    description: '{base}: deletes every item the body lists in one call. Locked as a bulk delete.'
  - match: 'PUT /api/v3/config/host/{id}'
    description: >-
      Changes the host settings: sign-in, API key, bind address, port, URL base, SSL, proxy and update script.
      Locked: it can lock users out or expose Radarr.
    summaryNote: '(sign-in, bind address, port, URL base, proxy and update script)'
  - match: 'PUT /api/v3/config/mediamanagement/{id}'
    description: >-
      Changes media management: the import script, file permissions and owner, and the recycle bin. Locked: the
      import script runs any program on every import.
    summaryNote: '(import script, file permissions and owner, recycle bin)'
  - match: 'POST /api/v3/system/shutdown'
    description: 'Shuts Radarr down until someone starts it again. Locked.'
  - match: 'POST /api/v3/system/restart'
    description: 'Restarts Radarr, stopping running commands and imports. Locked.'
  - match: 'POST /api/v3/system/backup/restore/{id}'
    description: 'Restores a stored backup over the database and settings, then restarts. Locked.'
    summaryNote: '(replaces the database and settings, then restarts)'
  - match: 'POST /reset-password*'
    description: 'Resets the web UI sign-in password, or asks for a reset. Locked: it changes who can sign in.'
    summaryNote: '(resets the UI login)'
    sensitiveParams: [/body/password, /body/passwordConfirmation, /body/token]
  - match: 'PUT /api/v3/movie/{id}'
    description: 'Changes a movie: monitoring, quality profile, tags, path. With moveFiles it takes the #move-files twin.'
  - match: 'POST /api/v3/command'
    description: 'Runs a command (search, refresh, rescan, backup). One not in the quick list takes the #heavy twin.'
  - match:
      - 'POST /api/v3/downloadclient'
      - 'PUT /api/v3/downloadclient/{id}'
      - 'POST /api/v3/downloadclient/test'
      - 'POST /api/v3/downloadclient/action/{name}'
    description: >-
      {base}: a client that writes files to a host folder takes the #folder twin, and a stored one sent to a new
      destination the #stored twin.
  - match: ['POST /api/v3/notification', 'POST /api/v3/notification/testall']
    description: '{base}: a notification that runs a program takes the #script twin.'
  - match:
      ['PUT /api/v3/notification/{id}', 'POST /api/v3/notification/test', 'POST /api/v3/notification/action/{name}']
    description: >-
      {base}: a notification that runs a program takes the #script twin, and a stored one sent to a new destination
      the #stored twin.
  - match:
      - 'POST /api/v3/indexer/test'
      - 'POST /api/v3/indexer/action/{name}'
      - 'PUT /api/v3/indexer/{id}'
      - 'POST /api/v3/importlist/test'
      - 'POST /api/v3/importlist/action/{name}'
      - 'PUT /api/v3/importlist/{id}'
    description: '{base}: a stored connection sent to a new destination (path or body `id`) takes the #stored twin.'

  # The literal an approver types: the stored item's name, never a body field the model writes except on create.
  - match: '* /api/v3/movie/{id}*'
    confirm:
      lookup: { op: 'GET /api/v3/movie/{id}', args: [{ id: { $param: /path/id } }], field: title }
  - match: ['* /api/v3/movie/editor*', 'DELETE */bulk']
    confirm: [{ custom: count }, instance]
  - match: '* /api/v3/system/backup/*'
    confirm:
      lookup: { op: 'GET /api/v3/system/backup', find: { field: id, equals: { $param: /path/id } }, field: name }
  - match:
      - 'PUT /api/v3/config/host/{id}'
      - 'PUT /api/v3/config/mediamanagement/{id}'
      - 'POST /api/v3/system/shutdown'
      - 'POST /api/v3/system/restart'
      - 'POST /reset-password*'
      - 'POST /api/v3/notification/testall#script'
    confirm: instance
  - match: '*#heavy'
    confirm: [{ custom: command }, instance]
  - match: 'POST /api/v3/downloadclient/*#stored'
    confirm:
      lookup: { op: 'GET /api/v3/downloadclient/{id}', args: [{ id: { $param: /body/id } }], field: name }
  - match: 'POST /api/v3/indexer/*#stored'
    confirm:
      lookup: { op: 'GET /api/v3/indexer/{id}', args: [{ id: { $param: /body/id } }], field: name }
  - match: 'POST /api/v3/importlist/*#stored'
    confirm:
      lookup: { op: 'GET /api/v3/importlist/{id}', args: [{ id: { $param: /body/id } }], field: name }
  - match: 'PUT /api/v3/downloadclient/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v3/downloadclient/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: 'PUT /api/v3/indexer/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v3/indexer/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: 'PUT /api/v3/importlist/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v3/importlist/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: 'PUT /api/v3/notification/{id}#*'
    confirm:
      lookup: { op: 'GET /api/v3/notification/{id}', args: [{ id: { $param: /path/id } }], field: name }
  - match: ['POST /api/v3/downloadclient#folder', 'POST /api/v3/downloadclient/*#folder']
    confirm:
      - lookup: { op: 'GET /api/v3/downloadclient/{id}', args: [{ id: { $param: /body/id } }], field: name }
      - param: /body/name
      - instance
  - match:
      ['POST /api/v3/notification#script', 'POST /api/v3/notification/*#script', 'POST /api/v3/notification/*#stored']
    confirm:
      - lookup: { op: 'GET /api/v3/notification/{id}', args: [{ id: { $param: /body/id } }], field: name }
      - param: /body/name
      - instance

  # Provider settings carry passwords, API keys and webhook URLs with tokens in `fields[].value`; the approver
  # sees the destination host as a target instead (src/targets.ts).
  - match:
      - '* /api/v3/downloadclient*'
      - '* /api/v3/indexer*'
      - '* /api/v3/importlist*'
      - '* /api/v3/notification*'
      - '* /api/v3/metadata*'
    sensitiveParams: [/body/fields]
  - match: 'PUT /api/v3/config/host/{id}'
    sensitiveParams:
      [/body/apiKey, /body/password, /body/passwordConfirmation, /body/proxyPassword, /body/sslCertPassword]
  # A pushed release's links and guid can carry the indexer's API key or the tracker passkey.
  - match: 'POST /api/v3/release/push'
    sensitiveParams: [/body/downloadUrl, /body/magnetUrl, /body/guid, /body/infoUrl, /body/commentUrl]
  - match: '* /api/v3/config/host*'
    sensitiveResult: { keys: [apiKey, password, passwordConfirmation, proxyPassword, sslCertPassword] }
  # Release and history links carry the indexer's API key or the tracker passkey. src/plugin.ts also hides them in
  # any case and cuts link-shaped guids, info and comment links to their origin.
  - match: ['* /api/v3/release*', '* /api/v3/history*']
    sensitiveResult: { keys: [downloadUrl, magnetUrl, url], deep: true }

plugin:
  # The spec for the instance's release tag (v<4-part version>), else the fallback branch; the base URL is a
  # connection field (`specBaseUrl`), so a mirror with the layout <url>/<ref>/<file> works offline.
  spec:
    baseUrl: https://raw.githubusercontent.com/Radarr/Radarr
    file: src/Radarr.Api.V3/openapi.json
    fallbackRef: develop
    maxBytes: 5242880
    timeoutMs: 20000
  # Endpoint and field that report the version (it needs the API key, so it also proves it).
  versionPath: /api/v3/system/status
  versionField: version
  # Refuse a spec with fewer operations: a truncated one must not replace the catalog.
  minOperations: 150
  # Searches, refreshes, rescans, checks and backups take the ordinary `POST /api/v3/command`: they write metadata
  # or a backup and may delete empty folders, but none takes a caller's folder, installs, updates or restarts. Any
  # other name, a future one included, takes the locked `#heavy` twin; Radarr matches names case-insensitively.
  # A manual `ApplicationCheckUpdate` ignores the auto-update setting and installs an update, so it is not listed.
  quickCommands:
    - Backup
    - CheckHealth
    - CutoffUnmetMoviesSearch
    - Housekeeping
    - ImportListSync
    - MissingMoviesSearch
    - MoviesSearch
    - RefreshCollections
    - RefreshMonitoredDownloads
    - RefreshMovie
    - RescanMovie
    - RssSync
  # Request keys the rules, targets and pointers read, in Radarr's spelling. Radarr binds query and body keys
  # case-insensitively, so `MoveFiles` or `Id` is renamed to this spelling, and two keys that differ only in case
  # are refused (src/request.ts).
  # Top-level body keys that also decide where a provider connects, for the #stored check (src/stored.ts).
  destinationKeys: []
  canonicalKeys:
    - id
    - name
    - fields
    - implementation
    - title
    - path
    - rootFolderPath
    - movieIds
    - ids
    - movieFileIds
    - deleteFiles
    - moveFiles
    - addImportExclusion
    - useScriptImport
    - scriptImportPath
    - downloadUrl
    - magnetUrl
    - guid
    - infoUrl
    - commentUrl
    - apiKey
    - password
    - passwordConfirmation
    - proxyPassword
    - sslCertPassword
    - token
